<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <g transform="translate(400, 60)" stroke="#333333" stroke-width="1" fill="none">
    <!-- Isometric Cube -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" />
    <line x1="0" y1="0" x2="0" y2="40" />
    <line x1="0" y1="0" x2="34.6" y2="-20" />
    <line x1="0" y1="0" x2="-34.6" y2="-20" />
    <!-- Inner pulsing core -->
    <circle cx="0" cy="0" r="4" fill="#555555" stroke="none">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Orbiting data packet -->
    <circle cx="0" cy="0" r="2.5" fill="#aaaaaa" stroke="none">
      <animateMotion path="M 0,0 L 34.6,-20 L 0,-40 L -34.6,-20 Z" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>