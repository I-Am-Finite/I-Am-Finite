<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#050505"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" stop-opacity="1"/>
      <stop offset="50%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Animated Geometric Core -->
  <g opacity="0.4" stroke="#444444" stroke-width="0.5" fill="none">
    <!-- Outer Orbit -->
    <circle cx="400" cy="150" r="120" stroke-dasharray="2 4">
      <animateTransform attributeName="transform" type="rotate" from="0 400 150" to="360 400 150" dur="120s" repeatCount="indefinite" />
    </circle>
    
    <!-- Complex Hexagons -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 150" to="360 400 150" dur="80s" repeatCount="indefinite" />
      <polygon points="400,30 503.9,90 503.9,210 400,270 296.1,210 296.1,90" />
      <line x1="400" y1="30" x2="400" y2="270" />
      <line x1="503.9" y1="90" x2="296.1" y2="210" />
      <line x1="503.9" y1="210" x2="296.1" y2="90" />
    </g>
    
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 400 150" to="0 400 150" dur="60s" repeatCount="indefinite" />
      <polygon points="400,50 486.6,100 486.6,200 400,250 313.4,200 313.4,100" stroke="#666666" />
      <polygon points="400,75 465,112.5 465,187.5 400,225 335,187.5 335,112.5" />
    </g>
  </g>

  <!-- Gradient Overlay to fade edges -->
  <rect width="100%" height="100%" fill="url(#fade)" />
  
  <!-- Typography -->
  <g text-anchor="middle" font-family="'Courier New', Courier, monospace">
    <text x="400" y="145" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="10">MICHAEL RESER</text>
    <text x="400" y="175" font-size="12" fill="#888888" letter-spacing="14">CHROMA LABS</text>
  </g>
</svg>